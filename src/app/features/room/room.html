<div class="studio-container">

    <main class="main-screen">
        <div class="stage-wrapper">
            <app-stage></app-stage>
        </div>
    </main>

    <aside class="sidebar-panel">
        <app-chat></app-chat>
    </aside>

    <footer class="controls-bar">
        <div class="control-buttons">
            
            <button class="btn-control" 
                    [class.danger]="isMuted" 
                    (click)="toggleMute()"
                    [title]="isMuted ? 'Activar micrófono' : 'Desactivar micrófono'">
                <span class="material-symbols-outlined">
                    {{ isMuted ? 'mic_off' : 'mic' }}
                </span>
            </button>

            <button class="btn-control" 
                    [class.danger]="isCameraOff" 
                    (click)="toggleCamera()"
                    [title]="isCameraOff ? 'Activar cámara' : 'Desactivar cámara'">
                <span class="material-symbols-outlined">
                    {{ isCameraOff ? 'videocam_off' : 'videocam' }}
                </span>
            </button>

            <button class="btn-control" 
                    [class.active]="isScreenSharing" 
                    (click)="toggleScreenShare()"
                    [title]="isScreenSharing ? 'Dejar de compartir pantalla' : 'Compartir pantalla'">
                <span class="material-symbols-outlined">
                    present_to_all
                </span>
            </button>

            <button class="btn-control leave" 
                    (click)="leaveRoom()"
                    title="Salir de la sala">
                <span class="material-symbols-outlined">
                    call_end
                </span>
            </button>

        </div>
    </footer>

</div>
