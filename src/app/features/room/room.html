<div class="studio-container">
  
  <header class="room-header">
    <div class="room-info">
      <div class="pulse-indicator"></div>
      <h2>Estudio Activo</h2>
      <span class="badge host" *ngIf="isHost">ANFITRIÓN</span>
      <span class="badge guest" *ngIf="!isHost">INVITADO</span>
    </div>
    <button class="btn-outline" (click)="copyRoomLink()">🔗 Copiar Enlace</button>
  </header>

  <div class="main-layout">
    
    <main class="main-screen">
      <div class="stage-wrapper">
        <app-stage></app-stage>
      </div>
      
      <footer class="controls-bar">
        <div class="control-buttons">
          <button class="btn-control" 
                  [class.danger]="isMuted" 
                  (click)="toggleMute()"
                  title="Micrófono">
            <span class="material-symbols-outlined">{{ isMuted ? 'mic_off' : 'mic' }}</span>
          </button>

          <button class="btn-control" 
                  [class.danger]="isCameraOff" 
                  (click)="toggleCamera()"
                  title="Cámara">
            <span class="material-symbols-outlined">{{ isCameraOff ? 'videocam_off' : 'videocam' }}</span>
          </button>

          <button class="btn-control" 
                  [class.active]="isScreenSharing" 
                  (click)="toggleScreenShare()"
                  title="Compartir pantalla">
            <span class="material-symbols-outlined">present_to_all</span>
          </button>

          <button class="btn-control leave" 
                  (click)="leaveRoom()"
                  title="Salir de la sala">
            <span class="material-symbols-outlined">call_end</span>
          </button>
        </div>
      </footer>
    </main>

    <aside class="sidebar-panel">
      <app-chat [roomId]="roomId" class="chat-component"></app-chat>
    </aside>

  </div>
</div>
