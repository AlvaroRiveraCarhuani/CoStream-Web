<div class="stage-container" *ngIf="isHost && roomState.backstageParticipants().length > 0">
    <div class="backstage-bar">
        <div class="backstage-header">
            <span>Backstage ({{ roomState.backstageParticipants().length }})</span>
            <span class="info-text">Los invitados aquí no son visibles en la transmisión</span>
        </div>
        <div class="backstage-list">
            @for (participant of roomState.backstageParticipants(); track participant.userId) {
            <div class="backstage-tile">
                <div class="avatar-placeholder">
                    <span class="material-symbols-outlined">person</span>
                </div>
                <div class="info">
                    <span class="name">{{ participant.name }}</span>
                    <span class="status">Esperando...</span>
                </div>
                <button class="btn-promote" *ngIf="isHost" (click)="subirAlEscenario(participant.userId)">
                    <span class="material-symbols-outlined">arrow_upward</span> Subir
                </button>
            </div>
            } @empty {
            <div class="empty-backstage">
                No hay nadie esperando en el backstage
            </div>
            }
        </div>
    </div>
</div>
